input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
    ecs_compatibility => "disabled"
    max_content_length => 1048576
  }
}

filter {
  ruby {
    id => "check_import_context"

    code => '
      event.set("[@metadata]", {})
      event.set("[@metadata][route]", "rejects")
      event.set("[@metadata][failure_kind]", "data")

      context = event.get("context")
      valid = context.is_a?(Hash)

      if valid
        valid = [
          "upload_id", "source_path", "original_filename"
        ].all? do |field|
          value = context[field]
          value.is_a?(String) &&
            !value.strip.empty? &&
            !/[\x00-\x1f]/.match?(value)
        end

        number = context["source_line"]

        valid &&= number.is_a?(Integer) &&
          number.between?(1, 9223372036854775807)
      end

      event.set("[@metadata][context_ok]", valid)

      unless valid
        event.set("[@metadata][failure_kind]", "technical")
        event.set("errors", [{
          "code" => "IMPORT_CONTEXT",
          "field" => nil,
          "message" => "Contexte technique de l import absent ou incorrect."
        }])
      end
    '
  }

  if [@metadata][context_ok] {
    ruby {
      id => "parse_source"
      path => "/usr/share/logstash/scripts/parse.rb"
    }

    if [@metadata][parse_ok] {
      ruby {
        id => "validate_source"
        path => "/usr/share/logstash/scripts/validate.rb"
      }

      if [@metadata][validation_ok] {
        ruby {
          id => "normalize_source"
          path => "/usr/share/logstash/scripts/normalize.rb"
        }

        if "_rubyexception" not in [tags] {
          mutate {
            add_field => {
              "[@metadata][route]" => "logs"
            }
          }
        }
      }
    }
  }

  if [@metadata][route] != "logs" {
    ruby {
      id => "prepare_rejection"

      code => '
        context = event.get("context")
        context = {} unless context.is_a?(Hash)

        errors = event.get("errors")
        failure_kind = event.get("[@metadata][failure_kind]") || "data"
        tags = event.get("tags") || []

        if tags.include?("_rubyexception") ||
            !errors.is_a?(Array) || errors.empty?
          failure_kind = "technical"
          errors = [{
            "code" => "PIPELINE_ERROR",
            "field" => nil,
            "message" => "Erreur technique pendant le traitement."
          }]
        end

        rejection = {
          "upload_id" => context["upload_id"],
          "source_line" => context["source_line"],
          "original_filename" => context["original_filename"],
          "failure_kind" => failure_kind,
          "errors" => errors,
          "raw" => event.get("raw")
        }

        event.to_hash.keys.each do |field|
          event.remove(field) unless field == "@metadata"
        end

        rejection.each do |field, value|
          event.set(field, value)
        end

        event.set("[@metadata][route]", "rejects")
      '
    }
  }
}

output {
  if [@metadata][route] == "logs" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "loganalyzer-logs-%{+yyyy.MM.dd}"
      document_id => "%{[event][id]}"
      action => "index"
      data_stream => false
      ilm_enabled => false
      manage_template => false
    }
  } else {
    file {
      path => "/usr/share/logstash/data/rejections/rejections.jsonl"
      codec => json_lines
      flush_interval => 0
    }
  }
}