<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rechercher des logs — LogAnalyzer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f4f6fa;
      color: #172033;
    }
    main { max-width: 1200px; margin: 32px auto; padding: 20px; }
    nav { display: flex; gap: 20px; flex-wrap: wrap; }
    section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    label { display: grid; gap: 6px; }
    input, select, button { font: inherit; padding: 10px; }
    input, select { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: top;
    }
    td { overflow-wrap: anywhere; }
    #search-message[data-error="true"] { color: #a31818; }
  </style>
</head>
<body>
<main>
  <nav aria-label="Navigation principale">
    <a href="{{ url_for('home') }}">Importer des logs</a>
    <a href="{{ url_for('search.search_page') }}" aria-current="page">
      Rechercher des logs
    </a>
    <a href="{{ url_for('api_docs.swagger_ui') }}">Swagger</a>
  </nav>

  <h1>Rechercher des logs</h1>

  <section aria-labelledby="filters-title">
    <h2 id="filters-title">Recherche et filtres</h2>

    <form id="search-form">
      <div class="filters">
        <label>
          Recherche générale
          <input type="search" name="general" maxlength="500"
                 placeholder="Exemples : warnig, task, 4">
        </label>

        <label>
          Texte dans les messages
          <input type="search" name="q" maxlength="500"
                 placeholder="Exemple : tâches">
        </label>

        <label>
          Niveau
          <select name="level">
            <option value="">Tous les niveaux</option>
            <option>DEBUG</option>
            <option>INFO</option>
            <option>WARNING</option>
            <option>ERROR</option>
            <option>CRITICAL</option>
          </select>
        </label>

        <label>
          Service exact
          <input name="service" maxlength="64"
                 placeholder="Exemple : task-service">
        </label>

        <label>
          Début de période — UTC
          <input type="datetime-local" name="start" step="0.001">
        </label>

        <label>
          Fin de période — UTC
          <input type="datetime-local" name="end" step="0.001">
        </label>

        <label>
          Trier par
          <select name="sort">
            <option value="date">Date de l’événement</option>
            <option value="level">Niveau — ordre alphabétique</option>
            <option value="service">Service — ordre alphabétique</option>
          </select>
        </label>

        <label>
          Ordre
          <select name="order">
            <option value="desc">Décroissant</option>
            <option value="asc">Croissant</option>
          </select>
        </label>
      </div>

      <p>La période porte sur la date des événements, pas sur la date d’import.</p>

      <div class="actions">
        <button type="submit">Rechercher</button>
        <button type="reset">Réinitialiser</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="results-title">
    <h2 id="results-title">Résultats</h2>
    <p id="search-message" role="status" aria-live="polite"></p>
    <p id="search-count"></p>

    <div id="search-results" aria-busy="false">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Date / heure — UTC</th>
              <th scope="col">Niveau</th>
              <th scope="col">Service</th>
              <th scope="col">Message</th>
            </tr>
          </thead>
          <tbody id="search-body"></tbody>
        </table>
      </div>

      <div class="actions" aria-label="Pagination">
        <button id="previous-page" type="button" disabled>Précédent</button>
        <span id="page-information"></span>
        <button id="next-page" type="button" disabled>Suivant</button>
      </div>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='search.js') }}" defer></script>
</body>
</html>
